name: Compilar Zen (Basado en Docs + CI Original)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Liberar espacio en disco (Evita errores de almacenamiento)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false

      - name: Clonar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 10
          submodules: recursive

      - name: Configurar Node.js (v20 estándar de Zen)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar usuario global de Git (Previene errores de parches)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Configurar Rust y arquitectura
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source $HOME/.cargo/env
          rustup target add x86_64-unknown-linux-gnu
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Instalar dependencias del sistema y compiladores (Lista completa)
        run: |
          sudo apt-get update --fix-missing
          sudo apt-get install -y curl python3 python3-pip dos2unix yasm nasm build-essential libgtk2.0-dev libpython3-dev m4 uuid libasound2-dev libcurl4-openssl-dev libdbus-1-dev libdrm-dev libdbus-glib-1-dev libgtk-3-dev libpulse-dev libx11-xcb-dev libxt-dev xvfb lld llvm clang sccache

      - name: Inyectar límites de RAM (mozconfig)
        run: |
          echo "ac_add_options --disable-lto" > mozconfig
          echo "mk_add_options MOZ_MAKE_FLAGS=\"-j2\"" >> mozconfig
          echo "export MOZCONFIG=\$(pwd)/mozconfig" >> $GITHUB_ENV

      - name: Instalar dependencias NPM
        run: npm ci

      - name: 1. Descargar el motor de Firefox
        run: npm run download

      - name: 1.5. Inyectar Commit Inicial (Engaña a mach y a git)
        # Se ejecuta justo después de descargar para que "import" y "bootstrap" 
        # encuentren un repositorio válido con historial.
        run: |
          cd engine
          git commit --allow-empty -m "Commit fantasma inicial" || true

      - name: 2. Importar parches de Zen Browser
        env:
          SURFER_COMPAT: x86_64
        run: npm run import

      - name: 3. Inicializar entorno de Mozilla (Bootstrap)
        run: |
          cd engine
          export SURFER_PLATFORM="linux"
          ./mach --no-interactive bootstrap --application-choice browser

      - name: 4. Actualizar paquetes de idioma
        run: python3 ./scripts/update_en_US_packs.py

      - name: 5. Compilar el navegador
        env:
          SURFER_COMPAT: x86_64
          SURFER_PLATFORM: linux
        run: npm run build

      - name: 6. Subir ejecutables compilados
        uses: actions/upload-artifact@v4
        with:
          retention-days: 5
          name: zen-browser-binarios
          path: engine/obj-*/dist/bin/
