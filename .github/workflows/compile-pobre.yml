name: Compilar Zen (Basado en Docs)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Liberar espacio (Los runners gratuitos de GitHub tienen disco pequeño)
      - name: Liberar espacio en disco
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false

      # 2. Equivalente a: git clone ... --depth 10 y cd desktop
      - name: Clonar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 10
          submodules: recursive # Clona los submódulos necesarios

      # 3. Requisito: Node.js 21
      - name: Instalar Node.js 21
        uses: actions/setup-node@v4
        with:
          node-version: '21'

      # 4. Requisito: Rust y Cargo
      - name: Instalar Rust y Cargo
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      # 5. Equivalente a: sudo apt update && sudo apt install ...
      - name: Instalar dependencias del sistema
        run: |
          sudo apt update
          sudo apt install -y curl python3 python3-pip git sccache

      # EXTRA VITAL PARA GITHUB ACTIONS: El salvavidas de RAM
      # La documentación asume que tienes una PC normal. El runner de GitHub 
      # solo tiene 7GB, así que inyectamos esto para que no colapse al final.
      - name: Inyectar límites de RAM (mozconfig)
        run: |
          echo "ac_add_options --disable-lto" > mozconfig
          echo "mk_add_options MOZ_MAKE_FLAGS=\"-j2\"" >> mozconfig
          echo "export MOZCONFIG=\$(pwd)/mozconfig" >> $GITHUB_ENV

      # 6. Equivalente a: npm i
      - name: Instalar dependencias NPM (npm i)
        run: npm i

      # 7. Equivalente a: npm run init
      - name: Inicializar el entorno (npm run init)
        run: npm run init

      # 8. Equivalente a: python3 ./scripts/update_en_US_packs.py
      - name: Actualizar paquetes de idioma
        run: python3 ./scripts/update_en_US_packs.py

      # 9. Equivalente a: npm run build
      - name: Compilar el navegador (npm run build)
        run: npm run build

      # 10. Extraer el resultado
      # La compilación pura deja los binarios en la carpeta 'obj-...'
      - name: Subir ejecutables compilados
        uses: actions/upload-artifact@v4
        with:
          retention-days: 5
          name: zen-browser-binarios
          path: engine/obj-*/dist/bin/
