name: Compilar Zen (Basado en Docs)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Liberar espacio en disco
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false

      - name: Clonar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 10
          submodules: recursive

      - name: Instalar Node.js 21
        uses: actions/setup-node@v4
        with:
          node-version: '21'

      - name: Instalar Rust y Cargo
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Instalar dependencias del sistema
        run: |
          sudo apt update
          sudo apt install -y curl python3 python3-pip git sccache clang lld llvm build-essential libgtk-3-dev libdbus-glib-1-dev libx11-xcb-dev libxt-dev

      - name: Inyectar límites de RAM (mozconfig)
        run: |
          echo "ac_add_options --disable-lto" > mozconfig
          echo "mk_add_options MOZ_MAKE_FLAGS=\"-j2\"" >> mozconfig
          echo "export MOZCONFIG=\$(pwd)/mozconfig" >> $GITHUB_ENV

      - name: Instalar dependencias NPM
        run: npm i

      # --- INICIO DEL DESGLOSE DE "npm run init" ---
      - name: Descargar el motor
        run: npm run download

      - name: Importar parches de Zen
        run: npm run import

      - name: Reparar Git en el motor (Commit fantasma)
        # Ahora sí, la carpeta 'engine' ya existe gracias al paso anterior
        run: |
          cd engine
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Commit fantasma para engañar a mach"

      - name: Inicializar entorno (Bootstrap manual)
        run: |
          cd engine
          export SURFER_PLATFORM="linux"
          ./mach --no-interactive bootstrap --application-choice browser
      # --- FIN DEL DESGLOSE ---

      - name: Actualizar paquetes de idioma
        run: python3 ./scripts/update_en_US_packs.py

      - name: Compilar el navegador (npm run build)
        run: npm run build

      - name: Subir ejecutables compilados
        uses: actions/upload-artifact@v4
        with:
          retention-days: 5
          name: zen-browser-binarios
          path: engine/obj-*/dist/bin/
